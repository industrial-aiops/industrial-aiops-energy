name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    # Release quality gate: ruff + bandit (0 Medium+) + pytest, mirroring the
    # base Industrial-AIOps repo. Energy protocol libs install on Linux for the
    # mock-based unit tests (drivers are monkeypatched; no live gear needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          # base package + IEC-104 + dev tools (these install cleanly from wheels)
          pip install -e ".[iec104,dev]"
          # dnp3 (pydnp3) — best effort: no wheel, needs a native opendnp3 source build that
          # fails on hosted runners; pydnp3 is imported LAZILY and the dnp3 unit tests monkeypatch
          # the client (test_dnp3.py), while test_dnp3_live.py skips cleanly when it's absent — so
          # coverage is unchanged. (Base roadmap: "DNP3 not yet CI-verifiable".)
          # Surface the outcome instead of swallowing it. Either branch is a fact worth
          # seeing in the run summary: if it stays unavailable, every build should say so
          # rather than let "green" imply the DNP3 live path was exercised; if it ever
          # starts installing, that is news too — test_dnp3_live.py would begin running.
          if pip install "pydnp3>=0.1,<1"; then
            echo "::notice title=DNP3::pydnp3 installed — test_dnp3_live.py will run this build"
          else
            echo "::warning title=DNP3 live path not exercised::pydnp3 could not be built (no wheel; opendnp3 source build fails on hosted runners). dnp3 unit tests use mocks and test_dnp3_live.py is SKIPPED — this build proves nothing about the DNP3 wire path."
          fi
          # iec61850 (linux-only wheel) — best effort; skipped if unavailable
          pip install "pyiec61850>=1.5.2a1,<2" || echo "pyiec61850 unavailable; iec61850 unit tests use the lazy-import path"
      - name: ruff
        run: ruff check iaiops_energy tests
      - name: ruff format (check)
        run: ruff format --check iaiops_energy tests
      - name: bandit (0 Medium+)
        run: bandit -q -r iaiops_energy --severity-level medium
      - name: pytest
        run: pytest -q

  margo-descriptor:
    # deploy/margo/margo.yaml is machine-read by an orchestrator we do not control,
    # and nothing checked it: a typo'd field name or a dropped enum value would ship
    # and surface as a deployment failure at a substation. Margo's compliance test
    # suite cannot be run today (it does not exist yet — no conformance repo in the
    # `margo` org), but the specification DOES publish a LinkML schema for the
    # Application Description, so structural validity is checkable now.
    #
    # Schema + Margo's own valid/invalid control examples are VENDORED under
    # deploy/margo/schema/ and pinned to an upstream commit — `pre-draft` is a moving
    # branch, and a live fetch would turn an upstream edit into a red build on an
    # unrelated PR. Mirrors the base repo's gate; see PROVENANCE.md there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install linkml
        run: pip install "linkml==1.11.1"
      # Validates the upstream valid AND invalid controls before our descriptor, so a
      # validator that stopped discriminating fails here instead of passing us vacuously.
      - name: validate against vendored margo.org/v1-alpha1 schema
        run: ./scripts/margo_validate.sh

      # Advisory: tells us the spec moved, never fails somebody's PR.
      - name: upstream schema drift (advisory)
        continue-on-error: true
        run: |
          upstream=$(mktemp)
          curl -fsSL -o "$upstream" \
            https://raw.githubusercontent.com/margo/specification/pre-draft/src/specification/applications/application-description.linkml.yaml
          if diff -q "$upstream" deploy/margo/schema/application-description.linkml.yaml >/dev/null; then
            echo "vendored schema matches upstream pre-draft"
          else
            echo "::warning::Margo's upstream schema has moved since it was vendored."
            diff "$upstream" deploy/margo/schema/application-description.linkml.yaml || true
          fi
